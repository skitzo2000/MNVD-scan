# MNVD Production Docker Compose
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No ports exposed - backend only accessible internally
    environment:
      - NODE_ENV=production
      - NVD_API_KEY=${NVD_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - PORT=3000
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
    volumes:
      - nvd_data:/app/data:rw
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mnvd-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mnvd-network
    depends_on:
      - backend

networks:
  mnvd-network:
    driver: bridge

volumes:
  nvd_data:
    driver: local