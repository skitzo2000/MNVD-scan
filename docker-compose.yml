services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # No ports exposed - only accessible within Docker network
    environment:
      - NODE_ENV=development
      - NVD_API_KEY=${NVD_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - PORT=3000
    volumes:
      - ./data:/app/data:rw
      - ./backend:/app:rw
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    # User mapping for development - set USER_ID/GROUP_ID in .env if needed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mnvd-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - mnvd-network
    depends_on:
      - backend

networks:
  mnvd-network:
    driver: bridge
