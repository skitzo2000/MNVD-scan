# ZERG Configuration for MNVD-scan
# Generated by zerg:init (Discovery Mode)

project:
  name: MNVD-scan
  description: "Monitor National Vulnerability Database with Discord/Teams notifications"
  type: monorepo

languages:
  primary: javascript
  all:
    - javascript
    - typescript

frameworks:
  backend: express
  frontend: nextjs
  ui: material-ui
  testing: shell-scripts

package_manager: npm

workers:
  max: 3
  default: 2

security:
  level: standard

infrastructure:
  docker: true
  ci: github-actions
  registry: ghcr.io
  compose:
    dev: docker-compose.yml
    production: docker-compose.production.yml
    versioned: docker-compose.versioned.yml

paths:
  backend: backend/
  frontend: frontend/
  tests: tests/
  data: data/
