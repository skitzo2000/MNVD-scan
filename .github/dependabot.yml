version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "skitzo2000"
    assignees:
      - "skitzo2000"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    # Group non-security updates together to reduce PR noise
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*-dev"
          - "eslint*"
          - "@eslint/*"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "*-dev"
          - "eslint*"
          - "@eslint/*"
          - "nodemon"
        update-types:
          - "minor"
          - "patch"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "skitzo2000"
    assignees:
      - "skitzo2000"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    # Group non-security updates together to reduce PR noise
    groups:
      production-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*-dev"
          - "eslint*"
          - "@eslint/*"
          - "@next/bundle-analyzer"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        patterns:
          - "*-dev"
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "@next/bundle-analyzer"
        update-types:
          - "minor"
          - "patch"

  # Backend Dockerfile
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "skitzo2000"
    assignees:
      - "skitzo2000"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
      - "backend"

  # Frontend Dockerfile
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "skitzo2000"
    assignees:
      - "skitzo2000"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
      - "frontend"

  # Root-level Dockerfile (Dockerfile.node)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "skitzo2000"
    assignees:
      - "skitzo2000"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "skitzo2000"
    assignees:
      - "skitzo2000"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Group GitHub Actions updates together
    groups:
      github-actions:
        patterns:
          - "*"
