name: Build and Push Frontend & Backend Docker Images to GHCR

on:
  push:
    branches:
      - main
  # Uncomment below to also build/push on tag creation
  # tags:
  #   types:
  #     - created

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0

      - name: Build Next.js frontend
        run: |
          cd frontend
          npm run build
          
      - name: Verify no build artifacts in git
        run: |
          if git status --porcelain | grep -E "\.next/|out/"; then
            echo "❌ Build artifacts found in git - this should not happen!"
            echo "Please update .gitignore to exclude build directories"
            exit 1
          else
            echo "✅ No build artifacts in git - good!"
          fi

      - name: Test backend dependencies
        run: |
          cd backend
          node -e "require('dotenv'); require('express'); require('axios'); require('cors'); require('helmet'); require('./dal'); console.log('All critical dependencies found')"

      - name: Test DAL architecture
        run: |
          cd backend
          node -e "
            const DataAccessLayer = require('./dal');
            console.log('Testing DAL initialization...');
            const dal = new DataAccessLayer('./test-data');
            dal.initialize().then(() => {
              console.log('DAL initialized successfully');
              return dal.getStats();
            }).then(stats => {
              console.log('DAL stats:', JSON.stringify(stats, null, 2));
              console.log('DAL architecture test passed');
            }).catch(err => {
              console.error('DAL test failed:', err);
              process.exit(1);
            });
          "

      - name: Test API endpoints (if available)
        run: |
          echo "API endpoint testing would require Docker Compose - skipping in CI"
          echo "Full integration tests should be run locally with: ./tests/run-all-tests.sh"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/skitzo2000/mnvd-scan-frontend:latest
            ghcr.io/skitzo2000/mnvd-scan-frontend:${{ env.SHORT_SHA }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/skitzo2000/mnvd-scan-frontend:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/skitzo2000/mnvd-scan-backend:latest
            ghcr.io/skitzo2000/mnvd-scan-backend:${{ env.SHORT_SHA }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/skitzo2000/mnvd-scan-backend:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max