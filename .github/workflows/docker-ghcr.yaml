name: Build and Push Frontend & Backend Docker Images to GHCR

on:
  push:
    branches:
      - main
  # Uncomment below to also build/push on tag creation
  # tags:
  #   types:
  #     - created

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0

      - name: Build Next.js frontend
        run: |
          cd frontend
          npm run build

      - name: Test backend dependencies
        run: |
          cd backend
          node -e "require('dotenv'); require('express'); require('sqlite3'); require('axios'); require('cors'); require('helmet'); console.log('All critical dependencies found')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/skitzo2000/mnvd-scan-frontend:latest
            ghcr.io/skitzo2000/mnvd-scan-frontend:${{ env.SHORT_SHA }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/skitzo2000/mnvd-scan-frontend:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/skitzo2000/mnvd-scan-backend:latest
            ghcr.io/skitzo2000/mnvd-scan-backend:${{ env.SHORT_SHA }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/skitzo2000/mnvd-scan-backend:{0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Compose integration
        run: |
          # Build images for testing
          docker compose build
          
          # Start services
          docker compose up -d
          
          # Wait for services to be ready
          sleep 30
          
          # Test frontend
          curl -f http://localhost:3000/ || exit 1
          
          # Test backend API
          curl -f http://localhost:3000/api/stats || exit 1
          
          # Check service health
          docker compose ps
          
          # Cleanup
          docker compose down

      - name: Test production configuration
        run: |
          # Test production build
          docker compose -f docker-compose.production.yml build
          
          # Start production services
          docker compose -f docker-compose.production.yml up -d
          
          # Wait for services to be ready
          sleep 30
          
          # Test production endpoints
          curl -f http://localhost:3000/ || exit 1
          curl -f http://localhost:3000/api/stats || exit 1
          
          # Cleanup
          docker compose -f docker-compose.production.yml down

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/skitzo2000/mnvd-scan-frontend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'