name: Build and Push Frontend & Backend Docker Images to GHCR

on:
  push:
    branches:
      - main
  # Uncomment below to also build/push on tag creation
  # tags:
  #   types:
  #     - created

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/skitzo2000/mnvd-scan-frontend:latest
            ghcr.io/skitzo2000/mnvd-scan-frontend:${{ env.SHORT_SHA }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/skitzo2000/mnvd-scan-frontend:{0}', github.ref_name) || '' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/skitzo2000/mnvd-scan-backend:latest
            ghcr.io/skitzo2000/mnvd-scan-backend:${{ env.SHORT_SHA }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/skitzo2000/mnvd-scan-backend:{0}', github.ref_name) || '' }}