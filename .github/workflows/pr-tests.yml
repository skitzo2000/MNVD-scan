name: Pull Request Tests

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test-docker-builds:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: mnvd-scan-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: mnvd-scan-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Lint frontend
        run: |
          cd frontend
          npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0
      
      - name: Test backend dependencies
        run: |
          cd backend
          node -e "require('dotenv'); require('express'); require('axios'); require('cors'); require('helmet'); require('./dal'); console.log('✅ All critical dependencies found')"
      
      - name: Test DAL architecture
        run: |
          cd backend
          node -e "
            const DataAccessLayer = require('./dal');
            console.log('Testing DAL initialization...');
            const dal = new DataAccessLayer('./test-data');
            dal.initialize().then(() => {
              console.log('DAL initialized successfully');
              return dal.getStats();
            }).then(stats => {
              console.log('DAL stats:', JSON.stringify(stats, null, 2));
              console.log('✅ DAL architecture test passed');
            }).catch(err => {
              console.error('❌ DAL test failed:', err);
              process.exit(1);
            });
          "
      
      - name: Test Docker runtime
        run: |
          chmod +x tests/test-docker-runtime.sh
          ./tests/test-docker-runtime.sh
      
      - name: Comment on PR
        uses: actions/github-script@v7
        if: success()
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ **PR Tests Passed**\n\n- Backend Docker image built successfully\n- Frontend Docker image built successfully\n- Frontend linting passed\n- Backend dependencies verified\n- DAL architecture test passed\n- Docker runtime tests passed (containers start without errors)'
            })
